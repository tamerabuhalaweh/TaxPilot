name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Requirements identifier-presence guard (stdlib only)
        run: |
          python docs/product/verify_traceability.py --report
          git diff --exit-code -- docs/product/TRACEABILITY-REPORT.md

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt
      - name: Ruff lint
        run: ruff check apps/api db tests .github/scripts
      - name: Ruff format check
        run: ruff format --check apps/api db tests .github/scripts
      - name: Mypy
        run: mypy apps/api
      - name: Backend unit tests
        env:
          PYTHONPATH: apps/api
        run: pytest apps/api/tests -q
      - name: Migration validation (needs postgres service)
        run: |
          python - <<'EOF'
          from pathlib import Path
          names = sorted(p.name for p in Path("db/migrations/versions").glob("*.sql"))
          assert names and names == sorted(names), "migrations missing or unordered"
          print("migration files:", names)
          EOF

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taxpilot
          POSTGRES_PASSWORD: taxpilot
          POSTGRES_DB: taxpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taxpilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt
      # TEST-SAFETY-01: destructive integration tests run ONLY against this
      # freshly created disposable database — never the primary service DB.
      # (psycopg is used instead of the psql CLI so no client binaries are needed.)
      - name: Create disposable destructive-test database
        run: |
          python - <<'EOF'
          import psycopg
          conn = psycopg.connect("host=localhost dbname=taxpilot user=taxpilot password=taxpilot", connect_timeout=10)
          conn.autocommit = True
          conn.execute("CREATE DATABASE taxpayer_test")
          conn.close()
          print("disposable destructive-test database created: taxpayer_test")
          EOF
      - name: "Migration + queue + API integration (services required: failures fail, never skip)"
        env:
          DATABASE_URL: postgresql+psycopg://taxpilot:taxpilot@localhost:5432/taxpilot
          TAXPILOT_DESTRUCTIVE_DATABASE_URL: postgresql+psycopg://taxpilot:taxpilot@localhost:5432/taxpilot_test
          TAXPILOT_ALLOW_DESTRUCTIVE_TESTS: "1"
          REDIS_URL: redis://localhost:6379/0
          REQUIRE_SERVICES: "1"
          PYTHONPATH: apps/api
        run: |
          python db/migrate.py
          python -m pytest tests/integration -q
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from app.main import create_app
          c = TestClient(create_app())
          assert c.get("/api/v1/health").status_code == 200
          print("api health ok against services")
          EOF

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install (reproducible, lockfile)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taxpilot
          POSTGRES_PASSWORD: taxpilot
          POSTGRES_DB: taxpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taxpilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r ../api/requirements.txt
      - name: Install frontend + Playwright browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build web
        run: npm run build
      - name: Migrate database (browser job needs Sprint 1 tables)
        working-directory: .
        env:
          DATABASE_URL: postgresql+psycopg://taxpilot:taxpilot@localhost:5432/taxpilot
        run: python db/migrate.py
      - name: Browser journey (API + web on loopback, proxy exercised end to end)
        env:
          PYTHONPATH: ../api
          DATABASE_URL: postgresql+psycopg://taxpilot:taxpilot@localhost:5432/taxpilot
          REDIS_URL: redis://localhost:6379/0
          API_INTERNAL_URL: http://127.0.0.1:8000
          E2E_BASE_URL: http://127.0.0.1:3000
        run: |
          python -m uvicorn app.main:app --port 8000 --app-dir ../api &
          echo $! > /tmp/tp-api.pid
          API_INTERNAL_URL=http://127.0.0.1:8000 npm start -- --port 3000 &
          echo $! > /tmp/tp-web.pid
          sleep 12
          curl -fsS http://127.0.0.1:3000/api/v1/health
          npx playwright test e2e/auth.spec.ts e2e/reviews.spec.ts e2e/proxy.spec.ts
          kill "$(cat /tmp/tp-api.pid)" "$(cat /tmp/tp-web.pid)"

  browser-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend + Playwright browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build demo configuration (no backend)
        run: npm run build
        env:
          NEXT_PUBLIC_PREVIEW_MODE: demo
      - name: Demo smoke (banner, clients, review, RTL persistence, disabled ops)
        env:
          E2E_BASE_URL: http://127.0.0.1:3001
        run: |
          npm start -- --port 3001 &
          echo $! > /tmp/tp-demo.pid
          sleep 12
          curl -fsS http://127.0.0.1:3001/
          npx playwright test e2e/demo.spec.ts
          kill "$(cat /tmp/tp-demo.pid)"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python dependency audit (gate decides; scanner failure fails closed)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r apps/api/requirements.txt --format=json --output /tmp/pip-audit.json || true
          python .github/scripts/security_gate.py --ecosystem pip \
            --audit /tmp/pip-audit.json --exceptions .github/security-exceptions.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (gate decides; scanner failure fails closed)
        run: |
          cd apps/web && npm ci
          npm audit --omit=dev --json > /tmp/npm-audit.json || true
          python ../../.github/scripts/security_gate.py --ecosystem npm \
            --audit /tmp/npm-audit.json --exceptions ../../.github/security-exceptions.json
