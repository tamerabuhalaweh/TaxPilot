name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt
      - name: Ruff lint
        run: ruff check apps/api db tests .github/scripts
      - name: Ruff format check
        run: ruff format --check apps/api db tests .github/scripts
      - name: Mypy
        run: mypy apps/api
      - name: Backend unit tests
        env:
          PYTHONPATH: apps/api
        run: pytest apps/api/tests -q
      - name: Migration validation (needs postgres service)
        run: |
          python - <<'EOF'
          from pathlib import Path
          names = sorted(p.name for p in Path("db/migrations/versions").glob("*.sql"))
          assert names and names == sorted(names), "migrations missing or unordered"
          print("migration files:", names)
          EOF

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taxpilot
          POSTGRES_PASSWORD: taxpilot
          POSTGRES_DB: taxpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taxpilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt
      - name: Migration + queue + API integration (services required: failures fail, never skip)
        env:
          DATABASE_URL: postgresql+psycopg://taxpilot:taxpilot@localhost:5432/taxpilot
          REDIS_URL: redis://localhost:6379/0
          REQUIRE_SERVICES: "1"
          PYTHONPATH: apps/api
        run: |
          python db/migrate.py
          python -m pytest tests/integration -q
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from app.main import create_app
          c = TestClient(create_app())
          assert c.get("/api/v1/health").status_code == 200
          print("api health ok against services")
          EOF

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install (reproducible, lockfile)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taxpilot
          POSTGRES_PASSWORD: taxpilot
          POSTGRES_DB: taxpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taxpilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r ../api/requirements.txt
      - name: Install frontend + Playwright browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build web
        run: npm run build
      - name: Browser journey (API + web on loopback, proxy exercised end to end)
        env:
          PYTHONPATH: ../api
          DATABASE_URL: postgresql+psycopg://taxpilot:taxpilot@localhost:5432/taxpilot
          REDIS_URL: redis://localhost:6379/0
          API_INTERNAL_URL: http://127.0.0.1:8000
          E2E_BASE_URL: http://127.0.0.1:3000
        run: |
          python -m uvicorn app.main:app --port 8000 --app-dir ../api &
          echo $! > /tmp/tp-api.pid
          API_INTERNAL_URL=http://127.0.0.1:8000 npm start -- --port 3000 &
          echo $! > /tmp/tp-web.pid
          sleep 12
          curl -fsS http://127.0.0.1:3000/api/v1/health
          npx playwright test
          kill "$(cat /tmp/tp-api.pid)" "$(cat /tmp/tp-web.pid)"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python dependency audit (fails on non-exempt findings)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r apps/api/requirements.txt --format=json --output /tmp/pip-audit.json
          python .github/scripts/security_gate.py --ecosystem pip \
            --audit /tmp/pip-audit.json --exceptions .github/security-exceptions.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (fails on non-exempt high/critical)
        run: |
          cd apps/web && npm ci
          npm audit --omit=dev --json > /tmp/npm-audit.json
          python ../../.github/scripts/security_gate.py --ecosystem npm \
            --audit /tmp/npm-audit.json --exceptions ../../.github/security-exceptions.json
